<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIXEL ADVENTURE — 100 Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ui-ink:#24150b;
    --ui-deep:#34200f;
    --ui-panel:#5b3a1e;
    --ui-panel-alt:#7a4e27;
    --ui-border:#c98b4a;
    --ui-border-light:#f6d58f;
    --ui-text:#fff6e0;
    --ui-muted:#dcbd8c;
    --ui-accent:#ffe08a;
    --ui-green:#ffd27a;
    --ui-green-dark:#8f5a28;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#24150b; overflow:hidden;
    font-family:'Press Start 2P', monospace; user-select:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex;
    align-items:center; justify-content:center; }
  #stage { position:relative; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges;
    width:min(100vw, calc(100vh * 1.8182)); display:block;
    box-shadow:0 0 60px rgba(255,170,60,.25); }

  #hud { position:absolute; top:8px; left:8px; right:8px; display:flex;
    gap:8px; align-items:flex-start; pointer-events:none; z-index:5; }
  .panel { background:var(--ui-panel); border:3px solid var(--ui-border);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.45), inset 3px 3px 0 rgba(255,255,255,.12);
    padding:6px; color:var(--ui-text); font-size:8px; line-height:1.7; }
  .ui-accent { color:var(--ui-accent); }
  .ui-muted { color:var(--ui-muted); }
  .ui-stat { color:var(--ui-border-light); }
  .ui-danger { color:var(--ui-accent); }
  .bar { width:150px; height:10px; background:var(--ui-ink); border:2px solid var(--ui-border-light);
    position:relative; overflow:hidden; }
  .bar > i { position:absolute; inset:0; transform-origin:left; }
  #hpf { background:linear-gradient(#ff9a8a,#e53935); }
  #xpf { background:linear-gradient(#fff3b0,#ffb300); }
  .bar > b { position:absolute; inset:0; font-size:7px; color:var(--ui-text);
    text-align:center; line-height:10px; text-shadow:1px 1px 0 #000; font-weight:normal; }
  #coinbox { color:var(--ui-accent); }
  #wpn { color:var(--ui-border-light); max-width:220px; }

  #topbtns { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:6; }
  .pbtn { pointer-events:auto; cursor:pointer; font-family:inherit; font-size:8px;
    color:var(--ui-text); background:var(--ui-panel-alt); border:3px solid var(--ui-border);
    padding:8px 10px;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.5), inset 3px 3px 0 rgba(255,255,255,.12); }
  .pbtn:hover { background:var(--ui-green-dark); transform:translateY(-1px); }
  .pbtn:active { transform:translateY(1px); }
  .pbtn.gold { background:#8f5a28; border-color:var(--ui-border-light); }
  .pbtn.gold:hover { background:#a86d32; }
  .pbtn.red { background:#6b2a1c; border-color:#e0875a; }

  #prompt { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    z-index:5; display:none; }

  #fade { position:absolute; inset:0; background:#000; opacity:0;
    pointer-events:none; transition:opacity .5s; z-index:40; }

  #modalWrap { position:absolute; inset:0; display:none; z-index:30;
    background:rgba(20,10,4,.72); align-items:center; justify-content:center; }
  #modal { width:86%; max-width:760px; max-height:88%; overflow:hidden;
    background:var(--ui-deep); border:4px solid var(--ui-border);
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.5), inset 4px 4px 0 rgba(255,255,255,.08), 0 0 40px rgba(255,170,60,.3);
    color:var(--ui-text); font-size:8px; display:flex; flex-direction:column; }
  #modal .mhead { display:flex; justify-content:space-between; align-items:center;
    background:var(--ui-ink); padding:10px 12px; border-bottom:3px solid var(--ui-border); }
  #modal .mhead h2 { font-size:11px; color:var(--ui-border-light); }
  #modal .mbody { padding:10px 12px; overflow-y:auto; flex:1; }
  #modal .mbody::-webkit-scrollbar { width:10px; }
  #modal .mbody::-webkit-scrollbar-thumb { background:var(--ui-border); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tab { cursor:pointer; padding:7px 10px; background:var(--ui-panel); border:3px solid var(--ui-border); font-size:8px; color:var(--ui-muted); }
  .tab.on { color:var(--ui-text); background:var(--ui-green-dark); border-color:var(--ui-border-light); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
  .card { background:var(--ui-ink); border:3px solid #a8703a; padding:8px; line-height:1.8;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.4); }
  .card.trophy { border-color:var(--ui-border-light); }
  .card .nm { font-size:8px; margin-bottom:4px; }
  .card .st { color:var(--ui-border-light); font-size:7px; }
  .card .ds { color:var(--ui-muted); font-size:7px; margin:4px 0; line-height:1.6; }
  .card .pv { color:var(--ui-accent); font-size:8px; }
  .card button { margin-top:6px; width:100%; }
  .mini { font-size:7px; padding:6px 4px; cursor:pointer; font-family:inherit;
    color:var(--ui-text); background:#8f5a28; border:2px solid var(--ui-border-light); }
  .mini:hover { filter:brightness(1.2); }
  .mini.dis { background:#3a2a1a; border-color:#6b5238; color:#9b8260; cursor:not-allowed; }
  .mini.eq { background:#8f5a28; border-color:var(--ui-border-light); }
  .rarity-common{color:#fff6e0}.rarity-uncommon{color:#c5e1a5}.rarity-rare{color:#81d4fa}
  .rarity-epic{color:#ce93d8}.rarity-legendary{color:#f6d58f}.rarity-mythic{color:#ff9e80}
  .rarity-divine{color:#fff;text-shadow:0 0 6px #ffd27a}
  .lvlgrid { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
  .lvlcell { cursor:pointer; text-align:center; padding:9px 0; background:var(--ui-panel);
    border:3px solid var(--ui-border); font-size:8px; color:var(--ui-text); }
  .lvlcell:hover { background:var(--ui-green-dark); }
  .lvlcell.lock { background:#2a1a0e; color:#7a6040; border-color:#4a3220; cursor:not-allowed; }
  .lvlcell.boss { border-color:var(--ui-border-light); color:var(--ui-accent); }
  .lvlcell.boss.lock { border-color:#5a3d22; color:#8a6c48; }
  .lvlcell.done { background:#5f7a2c; border-color:var(--ui-border-light); }
  .srow { display:flex; align-items:center; justify-content:space-between;
    margin:12px 0; gap:10px; }
  input[type=range] { flex:1; accent-color:var(--ui-border-light); height:22px; }

  #witems { display:flex; gap:6px; overflow-x:auto; padding:4px 2px; }

  #witems::-webkit-scrollbar-thumb { background:var(--ui-border); }
  .wslot { min-width:74px; text-align:center; cursor:pointer; background:var(--ui-panel);
    border:3px solid #a8703a; padding:6px 4px; font-size:7px; color:var(--ui-muted); line-height:1.7; }
  .wslot.sel { border-color:var(--ui-border-light); color:var(--ui-text); background:var(--ui-green-dark); }
  .wslot .cnt { color:var(--ui-accent); }

  #toast { position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:50; display:none; background:var(--ui-ink); border:3px solid var(--ui-border-light);
    color:var(--ui-text); font-size:9px; padding:10px 16px; text-align:center; line-height:1.8;
    box-shadow:0 0 20px rgba(255,170,60,.3); }

  #title { position:absolute; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at 50% 30%, #7a4a22 0%, #24150b 70%); }
  #title h1 { font-size:34px; color:var(--ui-border-light); text-shadow:4px 4px 0 #8f5a28, 8px 8px 0 #000;
    letter-spacing:2px; animation:bob 2s ease-in-out infinite; }
  #title h2 { font-size:10px; color:var(--ui-accent); }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .blink { animation:blink 1s steps(2) infinite; font-size:11px; color:#fff; }
  @keyframes blink { 50% { opacity:0; } }
  #ctl { color:#d7b98a; font-size:8px; line-height:2; text-align:center; }

  html, body { touch-action:manipulation; }
  #touchUI { --u:clamp(46px, 12.5vmin, 88px); --n:4px; --lift:0px; position:fixed; inset:0; z-index:30;
    display:none; pointer-events:none; opacity:.92; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #touchUI.on { display:block; }
  #touchUI.inworld { --lift:84px; }
  .pixelcut { clip-path:polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0,
    calc(100% - var(--n)) var(--n), 100% var(--n), 100% calc(100% - var(--n)),
    calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%,
    var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n))); }

  #stickBase { --n:8px; position:absolute; pointer-events:auto; touch-action:none;
    left:calc(16px + env(safe-area-inset-left, 0px));
    bottom:calc(20px + var(--lift) + env(safe-area-inset-bottom, 0px));
    width:calc(var(--u) * 2.2); height:calc(var(--u) * 2.2);
    display:flex; align-items:center; justify-content:center;
    border:4px solid rgba(255,255,255,.4);
    background:
      linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.22)) center / 100% 4px no-repeat,
      linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.22)) center / 4px 100% no-repeat,
      rgba(255,255,255,.12);
    box-shadow:inset 6px 6px 0 rgba(255,255,255,.14), inset -6px -6px 0 rgba(0,0,0,.25); }
  #stickKnob { --n:6px; width:calc(var(--u) * .95); height:calc(var(--u) * .95); pointer-events:none;
    border:4px solid rgba(255,255,255,.65); background:rgba(255,255,255,.36);
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.3), inset -4px -4px 0 rgba(0,0,0,.25); }

  .tbtn { position:absolute; pointer-events:auto; touch-action:none; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; padding:0; cursor:pointer;
    border:4px solid rgba(255,255,255,.5); background:var(--tint, rgba(255,255,255,.16));
    box-shadow:inset 4px 4px 0 rgba(255,255,255,.22), inset -4px -4px 0 rgba(0,0,0,.3);
    color:#fff; font-family:inherit; font-size:clamp(5px, calc(var(--u) * .14), 9px);
    text-shadow:1px 1px 0 #000; -webkit-tap-highlight-color:transparent; animation:tpop .18s steps(3); }
  .tbtn svg { width:52%; height:52%; fill:#fff; shape-rendering:crispEdges;
    filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6)); pointer-events:none; }
  .tbtn.down { background:rgba(255,255,255,.42); transform:translateY(2px); }
  @keyframes tpop { from { transform:scale(.4); } to { transform:scale(1); } }

  .slotAttack { --tint:rgba(255,110,80,.26); width:calc(var(--u) * 1.7); height:calc(var(--u) * 1.7);

    bottom:calc(24px + var(--lift) + env(safe-area-inset-bottom, 0px)); }
  .slotJump { --tint:rgba(110,190,255,.26); width:calc(var(--u) * 1.15); height:calc(var(--u) * 1.15);

    bottom:calc(24px + var(--lift) + env(safe-area-inset-bottom, 0px)); }
  .slotDash { --tint:rgba(255,230,120,.26); width:calc(var(--u) * 1.05); height:calc(var(--u) * 1.05);
    right:calc(36px + var(--u) * 1.7 + env(safe-area-inset-right, 0px));

    bottom:calc(40px + var(--u) * 1.7 + var(--lift) + env(safe-area-inset-bottom, 0px)); }

  #tRemove { --tint:rgba(255,110,110,.28); }

<script>
const SPR_CACHE = {};

function shadeColor(hex, amount) {
  if (hex.length !== 7) return hex;
  const value = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (value >> 16) + amount));
  const g = Math.max(0, Math.min(255, ((value >> 8) & 255) + amount));
  const b = Math.max(0, Math.min(255, (value & 255) + amount));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function outlineColor(rows, x, y, pal) {
  const around = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  for (const [dx, dy] of around) {
    const row = rows[y + dy];
    const ch = row && row[x + dx];
    if (ch && ch !== '.' && ch !== ' ' && ch !== 'K') {
      const base = pal[ch] || pal.K;
      if (base.length !== 7) return pal.K;
      const value = parseInt(base.slice(1), 16);
      const r = Math.floor((value >> 16) * 0.3);
      const g = Math.floor(((value >> 8) & 255) * 0.3);
      const b = Math.floor((value & 255) * 0.3);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
  }
  return pal.K;
}

function makeSprite(key, rows, pal) {
  if (SPR_CACHE[key]) return SPR_CACHE[key];
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const isOpen = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return true;
    const ch = rows[y][x];
    return ch === '.' || ch === ' ' || ch === 'K';
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch === '.' || ch === ' ') continue;
    let color = pal[ch] || '#f0f';
    if (ch === 'K') color = outlineColor(rows, x, y, pal);
    if (ch !== 'K') {
      if (isOpen(x, y - 1)) color = shadeColor(color, 38);
      else if (isOpen(x - 1, y)) color = shadeColor(color, 18);
      else if (isOpen(x, y + 1)) color = shadeColor(color, -42);
      else if (isOpen(x + 1, y)) color = shadeColor(color, -24);
    }
    g.fillStyle = color;
    g.fillRect(x, y, 1, 1);
  }
  SPR_CACHE[key] = c;
  return c;
}

function mobSprite(type, c1, c2, eye) {
  const key = 'mob_' + type + '_' + c1 + '_' + c2;
  if (SPR_CACHE[key]) return SPR_CACHE[key];
  const pal = {
    K:'#14141f', O:c1, A:c2, F:c1, B:c2, P:'#222',
    E:eye || '#fff', M:'#000', W:'#e8e8e8'
  };
  return makeSprite(key, MOB_TEMPLATES[type], pal);
}

function bossSprite(type, c1, c2, eye, uid) {
  const key = 'boss_' + uid;
  if (SPR_CACHE[key]) return SPR_CACHE[key];
  const base = mobSprite(type, c1, c2, eye);
  const c = document.createElement('canvas');
  c.width = 40; c.height = 40;
  const g = c.getContext('2d');
  g.fillStyle = '#ffd23f';
  g.fillRect(12, 2, 16, 5);
  g.fillRect(13, 0, 3, 3); g.fillRect(18, 0, 3, 3); g.fillRect(24, 0, 3, 3);
  g.fillStyle = '#ff5252'; g.fillRect(18, 3, 3, 2);
  g.imageSmoothingEnabled = false;
  g.drawImage(base, 0, 0, 16, 16, 4, 7, 32, 32);
  SPR_CACHE[key] = c;
  return c;
}

function drawSwordSwing(g, x, y, dir, color, t) {
  g.save();
  g.translate(x, y);
  g.scale(dir, 1);
  g.rotate(-0.9 + t * 1.8);
  g.fillStyle = '#14141f';
  g.fillRect(0, -3, 34, 7);
  g.fillStyle = color;
  g.fillRect(1, -2, 30, 5);
  g.fillStyle = '#8a6d1c';
  g.fillRect(-2, -5, 5, 11);
  g.fillStyle = '#5a3a1a';
  g.fillRect(-8, -3, 6, 7);
  g.restore();
}

const AU = {
  ctx:null, gain:null, vol:0.5, timer:null, step:0, cur:null,
  init(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.gain = this.ctx.createGain();
      this.gain.gain.value = this.vol;
      this.gain.connect(this.ctx.destination);
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  },
  setVol(v){ this.vol=v; if(this.gain) this.gain.gain.value=v; },
  beep(f,dur,type,v,slide){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime((v||0.15),t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.gain);
    o.start(t); o.stop(t+dur);
  },
  sfx(name){
    if(!this.ctx) return;
    switch(name){
      case 'swing': this.beep(220,0.08,'square',0.08,300); break;
      case 'hit':   this.beep(160,0.09,'sawtooth',0.12,-80); break;
      case 'hurt':  this.beep(110,0.18,'sawtooth',0.16,-60); break;
      case 'coin':  this.beep(880,0.06,'square',0.1); this.beep(1320,0.1,'square',0.08); break;
      case 'gem':   this.beep(660,0.05,'sine',0.09); this.beep(990,0.08,'sine',0.07); break;
      case 'lvlup': [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,0.15,'square',0.12),i*90)); break;
      case 'buy':   this.beep(700,0.07,'square',0.12); this.beep(1050,0.12,'square',0.1); break;
      case 'boss':  this.beep(70,0.6,'sawtooth',0.2,40); break;
      case 'die':   this.beep(300,0.4,'sawtooth',0.14,-250); break;
      case 'win':   [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.beep(f,0.18,'square',0.12),i*110)); break;
      case 'place': this.beep(500,0.06,'square',0.1); break;
      case 'shoot': this.beep(520,0.06,'square',0.07,200); break;
      case 'dash':  this.beep(300,0.1,'sine',0.1,250); break;
    }
  },
  music(notes,bpm){
    this.stopMusic();
    this.cur={notes,bpm}; this.step=0;
    const iv = 60000/bpm/2;
    this.timer=setInterval(()=>{
      if(!this.ctx) return;
      const n=this.cur.notes[this.step%this.cur.notes.length];
      const oct=(this.step%8<4)?1:0.5;
      this.beep(n*oct,0.18,'triangle',0.05);
      if(this.step%4===0) this.beep(n*0.25,0.3,'sine',0.06);
      this.step++;
    },iv);
  },
  stopMusic(){ if(this.timer){clearInterval(this.timer); this.timer=null;} }
};

let parts=[], floats=[];
function addPart(x,y,vx,vy,life,c,size,grav=0){
  parts.push({x,y,vx,vy,life,ml:life,c,size,grav});
}
function burst(x,y,c,n=12,spd=120,size=4){
  for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2),v=rand(spd*0.3,spd);
    addPart(x,y,Math.cos(a)*v,Math.sin(a)*v,rand(0.3,0.7),c,rand(2,size),200); }
}
function addFloat(x,y,txt,c='#fff'){ floats.push({x,y,txt,c,life:1}); }
function updParts(dt){
  for(const p of parts){ p.life-=dt; p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.life-=dt*0.9; f.y-=30*dt; }
  floats=floats.filter(f=>f.life>0);
}
function drawParts(g,cam){
  for(const p of parts){
    g.globalAlpha=clamp(p.life/p.ml,0,1);
    g.fillStyle=p.c;
    g.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);
  }
  g.globalAlpha=1;
}
function drawFloats(g,cam){
  g.textAlign='center'; g.font='10px "Press Start 2P", monospace';
  for(const f of floats){
    g.globalAlpha=clamp(f.life,0,1);
    g.fillStyle='#000'; g.fillText(f.txt,f.x-cam.x+1,f.y-cam.y+1);
    g.fillStyle=f.c; g.fillText(f.txt,f.x-cam.x,f.y-cam.y);
  }
  g.globalAlpha=1;
}

function pixelBlob(g, cx, cy, r, color) {
  g.fillStyle = color;
  for (let dy = -r; dy <= r; dy += 2) {
    const half = Math.floor(Math.sqrt(r * r - dy * dy) / 2) * 2;
    g.fillRect(cx - half, cy + dy, half * 2, 2);
  }
}

function drawTree(g, cx, by, leaf, isPine) {
  g.fillStyle = 'rgba(0,0,0,0.25)';
  g.beginPath();
  g.ellipse(cx, by - 1, 20, 7, 0, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#4e342e';
  g.fillRect(cx - 4, by - 20, 8, 20);
  g.fillStyle = '#6d4c41';
  g.fillRect(cx - 4, by - 20, 3, 20);
  const dark = shadeColor(leaf, -45);
  const light = shadeColor(leaf, 40);
  const blobs = isPine
    ? [[0, -26, 14], [0, -38, 11], [0, -48, 7]]
    : [[-11, -30, 13], [11, -30, 13], [0, -40, 15], [0, -52, 10]];
  blobs.forEach(([dx, dy, r]) => pixelBlob(g, cx + dx + 2, by + dy + 3, r, dark));
  blobs.forEach(([dx, dy, r]) => pixelBlob(g, cx + dx, by + dy, r, leaf));
  blobs.forEach(([dx, dy, r]) => pixelBlob(g, cx + dx - 3, by + dy - 4, Math.max(4, r - 8), light));
}

function noiseTile(g, x, y, cA, cB, cC, tx, ty) {
  g.fillStyle = (tx + ty) % 2 === 0 ? cA : cB;
  g.fillRect(x, y, T, T);
  const seed = tx * 7919 + ty * 104729;
  const roll = n => (Math.imul(seed + n * 374761393, 668265263) >>> 15) % 1000 / 1000;
  const lightTone = shadeColor(cA, 24);
  for (let i = 0; i < 9; i++) {
    const px = x + 2 + Math.floor(roll(i) * (T - 6));
    const py = y + 2 + Math.floor(roll(i + 20) * (T - 8));
    g.fillStyle = cC;
    g.fillRect(px, py + 3, 3, 2);
    g.fillStyle = lightTone;
    g.fillRect(px + 1, py, 1, 3);
    g.fillRect(px - 1, py + 1, 1, 2);
    g.fillRect(px + 3, py + 1, 1, 2);
  }
  const detail = roll(40);
  if (detail > 0.93) {
    const rx = x + 8 + Math.floor(roll(41) * 28);
    const ry = y + 10 + Math.floor(roll(42) * 26);
    g.fillStyle = 'rgba(0,0,0,0.2)';
    g.fillRect(rx - 1, ry + 5, 9, 2);
    g.fillStyle = '#9e9e9e';
    g.fillRect(rx, ry, 7, 5);
    g.fillStyle = '#cfcfcf';
    g.fillRect(rx, ry, 7, 2);
  } else if (detail < 0.07) {
    g.fillStyle = cC;
    for (let k = 0; k < 3; k++) g.fillRect(x + 14 + k * 5, y + 18 - (k % 2) * 4, 2, 9);
    g.fillStyle = lightTone;
    for (let k = 0; k < 3; k++) g.fillRect(x + 14 + k * 5, y + 18 - (k % 2) * 4, 1, 9);
  }
  g.fillStyle = 'rgba(255,255,255,0.05)';
  g.fillRect(x, y, T, 2);
  g.fillStyle = 'rgba(0,0,0,0.06)';
  g.fillRect(x, y + T - 2, T, 2);
}

function drawWallTile(g, x, y, base) {
  g.fillStyle = shadeColor(base, -45);
  g.fillRect(x, y, T, T);
  g.fillStyle = shadeColor(base, -12);
  g.fillRect(x + 2, y + 2, T - 4, T / 2 - 3);
  g.fillRect(x + 2, y + T / 2 + 1, T - 4, T / 2 - 3);
  g.fillStyle = shadeColor(base, 28);
  g.fillRect(x + 2, y + 2, T - 4, 3);
  g.fillRect(x + 2, y + T / 2 + 1, T - 4, 3);
}

function drawWaterTile(g, tx, ty) {
  const x = tx * T, y = ty * T;

  const shift = (tx * 17 + ty * 31) % 30;

  g.fillRect(x + (shift + 20) % 36, y + 30, 9, 3);
  g.fillStyle = '#1f5fa8';
  g.fillRect(x + (shift + 8) % 32, y + 40, 10, 3);
  const touchesLand = (dx, dy) => {
    const row = HUB_MAP[ty + dy];
    return row !== undefined && row[tx + dx] !== undefined && row[tx + dx] !== 'W';
  };
  g.fillStyle = '#d9f2ff';
  if (touchesLand(0, 1)) g.fillRect(x, y + T - 5, T, 5);
  if (touchesLand(0, -1)) g.fillRect(x, y, T, 5);
  if (touchesLand(1, 0)) g.fillRect(x + T - 5, y, 5, T);
  if (touchesLand(-1, 0)) g.fillRect(x, y, 5, T);
}

function movePlayer(dt,solidFn,bounds){
  if(P.jumpT>0)P.jumpT-=dt;
  if(P.jumpCd>0)P.jumpCd-=dt;
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['arrowright'])dx+=1;
  if(keys['w']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['arrowdown'])dy+=1;
  if(stick.active){ dx+=stick.x; dy+=stick.y; }
  P.moving=(dx!==0||dy!==0);
  if(Math.abs(dx)>0.25)P.dir=dx>0?1:-1;
  if(dx!==0||dy!==0)P.face=Math.atan2(dy,dx);
  let spd = 190;
  if(P.dashT>0){ spd=520; P.dashT-=dt; }
  const l=Math.max(1,Math.hypot(dx,dy));
  let nx=P.x+dx/l*spd*dt, ny=P.y+dy/l*spd*dt;
  if(!solidFn(nx,P.y))P.x=nx;
  if(!solidFn(P.x,ny))P.y=ny;
  P.x=clamp(P.x,bounds.x0,bounds.x1);
  P.y=clamp(P.y,bounds.y0,bounds.y1);
}

    if(ch==='R')return{act:'levels',txt:'[E] Go To Advanture'};
    if(ch==='H')return{act:'world',txt:'[E] Go to private world'};
    if(ch==='X')return{act:'farm',txt:'[E] Go to Farming World'};
  }
  return null;
}
function interact(){
  AU.init();
  if(G.scene==='hub'){
    const n=nearInteract();
    if(!n)return;
    if(n.act==='shop')openShop('sword');
    if(n.act==='armor')openArmor();
    if(n.act==='levels')openLevels();
    if(n.act==='world')gotoWorld();
    if(n.act==='farm')gotoFarm();
  } else if(G.scene==='level' && G.door && dist(P,G.door)<82){
    openLevelDoor();
  } else if(G.scene==='farm' && dist(P,FARM_EXIT)<82){
    leaveFarm();
  }
}

function themeOf(lvl){ return THEMES[Math.floor((lvl-1)/10)]; }
function isBossLvl(lvl){ return lvl%5===0; }
function bossOf(lvl){ return BOSSES.find(b=>b.lvl===lvl); }

function startLevel(n){
  G.level=n; G.scene='level'; G.wave=0;
  $('worldbar').style.display='none';
  $('prompt').style.display='none';
  G.enemies=[]; G.projs=[]; G.drops=[]; G.boss=null;
  G.result=null; G.victory=null; G.door=null;
  const th=themeOf(n);
  G.levelBG=buildLevelBG(th);
  G.obstacles=[];
  if(!isBossLvl(n)){
    for(let i=0;i<3;i++)
      G.obstacles.push({x:randi(4,14)*T,y:randi(3,7)*T,w:T,h:T});
  }
  P.x=W/2; P.y=H-120; P.hp=Math.min(P.hp,pMaxHp());
  AU.music(th.music,th.bpm);
  if(isBossLvl(n)){
    spawnBoss(bossOf(n));
    toast(`⚠ BOSS LEVEL ${n} ⚠<br>${G.boss.name}`,3000);
    AU.sfx('boss');
  } else {
    nextWave();
    toast(`LEVEL ${n} — ${th.name}<br>Wave 1`,2500);
  }
  updateHUD();
}
function lvlSolid(px,py){
  if(px<T+8||px>W-T-8||py<T+20||py>H-T-4)return true;
  for(const o of G.obstacles)
    if(px>o.x-6&&px<o.x+o.w+6&&py>o.y+14&&py<o.y+o.h+6)return true;
  return false;
}
function spawnMob(lvl,mi){
  const th=themeOf(lvl);
  const maxIdx=clamp(1+Math.floor(((lvl-1)%10)/2.5),1,4);
  const mdef=th.mobs[Math.min(mi,maxIdx-1)];
  const tier=mdef.tier;
  const side=randi(0,3);
  let x,y;
  if(side===0){x=rand(T*2,W-T*2);y=T+30;}
  else if(side===1){x=rand(T*2,W-T*2);y=H-T-30;}
  else if(side===2){x=T+40;y=rand(T*2,H-T*2);}
  else {x=W-T-40;y=rand(T*2,H-T*2);}
  G.enemies.push({
    x,y, def:mdef,
    hp:Math.round((18+lvl*7)*tier), maxhp:Math.round((18+lvl*7)*tier),
    dmg:(3+lvl*1.2)*tier, spd:rand(55,75)+(mdef.t==='bat'?35:0)-(mdef.t==='golem'?20:0),
    spr:mobSprite(mdef.t,mdef.c,mdef.c2,mdef.e),
    t:mdef.t, tier,
    hop:rand(0,1), shootT:rand(2,4), dashT:0, dashCd:rand(2,4),
    slow:0, burn:0, hurtT:0, phase:rand(0,6),
  });
}
function nextWave(){
  G.wave++;
  const L=G.level;
  const n=G.wave===1? Math.min(2+Math.floor(L/4),6) : Math.min(3+Math.floor(L/3),8);
  for(let i=0;i<n;i++) setTimeout(()=>{ if(G.scene==='level'&&!G.victory) spawnMob(L,i%4); }, i*350);
}
function completeLevel(details={}){
  if(G.victory)return;
  const L=G.level;
  if(L>=S.progress&&L<100)S.progress=L+1;
  if(L===100&&S.progress<=100)S.progress=101;
  G.victory=details;
  G.door={x:W/2,y:100,next:L<100?L+1:null};
  G.enemies=[];
  G.projs=[];
  save();
  AU.sfx('win');
}
function collectRemainingDrops(){
  let coins=0, xp=0;
  for(const d of G.drops){
    if(d.kind==='coin')coins+=d.v;
    else xp+=d.v;
  }
  if(coins){
    S.coins+=coins;
    addFloat(P.x,P.y-56,'+'+coins+'🪙','#d9ffdf');
  }
  if(xp)gainXP(xp);
  G.drops=[];
  save();
}
function spawnBoss(bdef){
  const L=bdef.lvl, tier=BOSSES.indexOf(bdef)+1;
  G.boss={
    def:bdef, tier, x:W/2, y:120,
    hp:Math.round(300+L*90), maxhp:Math.round(300+L*90),
    dmg:10+L*1.8, spd:38+tier,
    spr:bossSprite(bdef.t,bdef.c,bdef.c2,bdef.e,tier),
    burstT:3, chargeT:9, charging:0, cvx:0, cvy:0, summoned:false,
    slow:0, burn:0, hurtT:0, tele:0,
  };
}
function tryAttack(){
  if(P.atkT>0||G.modal)return;
  const sd=swordDef();
  P.atkT = sd.abil==='swift'?0.28:0.45;
  P.atkAnim=0.22;
  AU.sfx('swing');
  if(sd.abil==='bolt'||sd.abil==='multi'){
    AU.sfx('shoot');
    const n=sd.abil==='multi'?3:1;
    for(let i=0;i<n;i++){
      const a=P.face+(i-(n-1)/2)*0.25;
      G.projs.push({x:P.x,y:P.y-18,vx:Math.cos(a)*430,vy:Math.sin(a)*430,
        dmg:pDmg(),from:'p',c:sd.color,r:5});
    }
  }
  const range=82, arc=1.15;
  const targets=[...G.enemies];
  if(G.boss)targets.push(G.boss);
  for(const e of targets){
    const d=dist(P,e);
    const rr=e===G.boss?range+50:range;
    if(d>rr)continue;
    const a=Math.atan2(e.y-P.y,e.x-P.x);
    let da=Math.abs(a-P.face); if(da>Math.PI)da=Math.PI*2-da;
    if(da<arc||d<34){
      let dmg=pDmg();
      let crit=false;
      if(sd.abil==='crit'&&Math.random()<0.25){dmg*=2;crit=true;}
      dmg=Math.round(dmg*rand(0.9,1.1));
      hurtEnemy(e,dmg,crit);
      if(sd.abil==='lifesteal')healP(Math.round(dmg*0.15));
      if(sd.abil==='burn')e.burn=3;
      if(sd.abil==='freeze')e.slow=2;
      if(sd.abil==='quake'){
        for(const o of targets)if(o!==e&&dist(o,e)<70)hurtEnemy(o,Math.round(dmg*0.4),false);
        shake(4);
      }
    }
  }
}
function hurtEnemy(e,dmg,crit){
  e.hp-=dmg; e.hurtT=0.12;
  addFloat(e.x,e.y-30,dmg,crit?'#ffd23f':'#fff');
  burst(e.x,e.y-14,crit?'#ffd23f':'#ff8a80',crit?10:5,100,3);
  AU.sfx('hit');
  if(e===G.boss){ shake(2); }
}
function healP(v){
  P.hp=clamp(P.hp+v,0,pMaxHp());
  if(v>0)addFloat(P.x,P.y-50,'+'+v,'#69f0ae');
}
function hurtP(dmg){
  if(P.hurtT>0||P.dashT>0||isAirborne())return;
  const red=Math.max(1,Math.round(dmg - pDef()*0.6));
  P.hp-=red; P.hurtT=0.7;
  addFloat(P.x,P.y-50,'-'+red,'#ff5252');
  burst(P.x,P.y-20,'#ff5252',8,120,3);
  shake(6); AU.sfx('hurt');
  if(P.hp<=0){
    P.hp=0;
    const res=G.result={win:false};
    G.modal=true;
    AU.sfx('die');
    setTimeout(()=>{ if(G.result===res) showDefeat(); },800);
  }
}
const JUMP_TIME = 0.5;

function isAirborne(){
  return P.jumpT > 0.08 && P.jumpT < JUMP_TIME - 0.08;
}

function tryJump(){
  if(P.jumpT>0||P.jumpCd>0||G.modal)return;
  P.jumpT=JUMP_TIME;
  P.jumpCd=0.9;
  AU.sfx('dash');
  burst(P.x,P.y-4,'#ffffff',6,60,2);
}

function tryDash(){
  if(P.dashCd>0||G.modal)return;
  P.dashCd=1.4; P.dashT=0.16; P.hurtT=Math.max(P.hurtT,0.18);
  AU.sfx('dash');
  burst(P.x,P.y-16,'#7ee0ff',8,90,3);
}
function gainXP(v){
  S.xp+=v;
  while(S.xp>=xpNeed()){
    S.xp-=xpNeed(); S.plvl++;
    P.hp=pMaxHp();
    AU.sfx('lvlup');
    toast(`LEVEL UP Lv ${S.plvl}<br>Damage and deffend upgrede`,2600);
    burst(P.x,P.y-24,'#ffe066',20,160,4);
  }
  save();
}
function spawnDrops(x,y,coinV,gemV){
  const nc=randi(2,4);
  for(let i=0;i<nc;i++)
    G.drops.push({kind:'coin',x:x+rand(-16,16),y:y+rand(-16,16),v:Math.max(1,Math.round(coinV/nc)),t:0});
  const ng=randi(1,2);
  for(let i=0;i<ng;i++)
    G.drops.push({kind:'gem',x:x+rand(-16,16),y:y+rand(-16,16),v:Math.max(1,Math.round(gemV/ng)),t:0});
}
function updEnemy(e,dt){
  const L=G.level;
  if(e.burn>0){ e.burn-=dt; e.hp-=Math.round(pDmg()*0.15*dt*10)/10;
    if(Math.random()<dt*8)addPart(e.x+rand(-8,8),e.y-20,rand(-10,10),-40,0.4,'#ff7043',3);
  }
  let sp=e.spd*(e.slow>0?0.5:1);
  if(e.slow>0)e.slow-=dt;
  if(e.hurtT>0)e.hurtT-=dt;
  const a=Math.atan2(P.y-e.y,P.x-e.x);
  const d=dist(P,e);
  e.phase+=dt;
  if(e.t==='slime'){
    e.hop-=dt;
    if(e.hop<=0){ e.hop=rand(0.5,1); e.vx=Math.cos(a)*sp*2.4; e.vy=Math.sin(a)*sp*2.4; }
    e.x+=(e.vx||0)*dt; e.y+=(e.vy||0)*dt;
  } else if(e.t==='bat'){
    e.x+=Math.cos(a)*sp*dt+Math.cos(e.phase*4)*40*dt;
    e.y+=Math.sin(a)*sp*dt+Math.sin(e.phase*3)*40*dt;
    e.shootT-=dt;
    if(e.shootT<=0&&d<340){ e.shootT=rand(2.5,4);
      G.projs.push({x:e.x,y:e.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,dmg:e.dmg*0.8,from:'e',c:'#ff8a80',r:4});
    }
  } else if(e.t==='ghost'){
    e.x+=Math.cos(a+Math.sin(e.phase*2)*0.6)*sp*dt;
    e.y+=Math.sin(a+Math.sin(e.phase*2)*0.6)*sp*dt;
    e.shootT-=dt;
    if(e.shootT<=0&&d<300){ e.shootT=rand(3,4.5);
      G.projs.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,dmg:e.dmg,from:'e',c:e.def.c,r:5});
    }
  } else if(e.t==='golem'){
    e.x+=Math.cos(a)*sp*dt; e.y+=Math.sin(a)*sp*dt;
    e.shootT-=dt;
    if(e.shootT<=0&&d<380){ e.shootT=rand(3.5,5);
      G.projs.push({x:e.x,y:e.y-20,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:e.dmg*1.2,from:'e',c:'#a1887f',r:7});
    }
  } else {
    e.dashCd-=dt;
    if(e.dashT>0){ e.dashT-=dt; e.x+=Math.cos(a)*sp*3.2*dt; e.y+=Math.sin(a)*sp*3.2*dt; }
    else {
      e.x+=Math.cos(a)*sp*dt; e.y+=Math.sin(a)*sp*dt;
      if(e.dashCd<=0&&d<200){ e.dashCd=rand(2.5,4); e.dashT=0.25; }
    }
  }
  if(dist(P,e)<30) hurtP(e.dmg);
  if(e.hp<=0&&!e.dead){
    e.dead=true;
    burst(e.x,e.y-14,e.def.c,16,150,4);
    if(e.farm) dropFarmXp(e);
    else spawnDrops(e.x,e.y, 2+L*0.8*e.tier, 8+L*2.5*e.tier);
  }
}
function updBoss(dt){
  const b=G.boss; if(!b)return;
  if(b.burn>0){ b.burn-=dt; b.hp-=pDmg()*0.15*dt; }
  if(b.slow>0)b.slow-=dt;
  if(b.hurtT>0)b.hurtT-=dt;
  const sp=b.spd*(b.slow>0?0.5:1);
  const a=Math.atan2(P.y-b.y,P.x-b.x);
  if(b.charging>0){
    b.charging-=dt;
    b.x+=b.cvx*dt; b.y+=b.cvy*dt;
    if(dist(P,b)<70)hurtP(b.dmg*1.5);
  } else {
    b.x+=Math.cos(a)*sp*dt; b.y+=Math.sin(a)*sp*dt;
    b.chargeT-=dt;
    if(b.chargeT<=0){ b.chargeT=rand(7,10); b.tele=0.6; }
  }
  if(b.tele>0){
    b.tele-=dt;
    if(b.tele<=0){
      b.charging=0.7;
      const s=380+b.tier*10;
      b.cvx=Math.cos(a)*s; b.cvy=Math.sin(a)*s;
      AU.sfx('dash');
    }
  }
  b.x=clamp(b.x,T+40,W-T-40); b.y=clamp(b.y,T+60,H-T-40);
  b.burstT-=dt;
  if(b.burstT<=0){
    b.burstT=Math.max(1.8,4-b.tier*0.09);
    const n=6+b.tier;
    for(let i=0;i<n;i++){
      const aa=(Math.PI*2/n)*i+rand(0,0.3);
      G.projs.push({x:b.x,y:b.y,vx:Math.cos(aa)*190,vy:Math.sin(aa)*190,
        dmg:b.dmg*0.7,from:'e',c:b.def.c2,r:5});
    }
    AU.sfx('shoot');
  }
  if(!b.summoned&&b.hp<b.maxhp/2){
    b.summoned=true;
    spawnMob(b.def.lvl,randi(0,3)); spawnMob(b.def.lvl,randi(0,3));
    toast(`${b.def.name} calling for help!`,1800);
  }
  if(dist(P,b)<64) hurtP(b.dmg);
  if(b.hp<=0){
    const bdef=b.def, tier=b.tier;
    burst(b.x,b.y,'#ffd23f',40,240,6);
    burst(b.x,b.y,bdef.c,30,200,5);
    shake(14); AU.sfx('win');
    const roll=Math.random();
    let dropped=null;
    if(roll<bdef.drop.chance){
      dropped=bdef.drop;
      if(!S.special.includes(BOSSES.indexOf(bdef))) S.special.push(BOSSES.indexOf(bdef));
    }
    let trophy=null;
    if(Math.random()<0.4){
      trophy=BOSSES.indexOf(bdef);
      S.trophy[trophy]=(S.trophy[trophy]||0)+1;
    }
    spawnDrops(b.x,b.y, 50+bdef.lvl*5, 100+bdef.lvl*20);
    G.boss=null;
    completeLevel({boss:bdef, dropped, trophy});
  }
}
function updLevel(dt){
  const th=themeOf(G.level);
  if(Math.random()<dt*4)ambientPart(th);
  movePlayer(dt,lvlSolid,{x0:T+10,x1:W-T-10,y0:T+22,y1:H-T-6});
  const pr=$('prompt');
  if(G.door && dist(P,G.door)<82){
    pr.style.display='block';
    pr.textContent=G.door.next
      ? `[E] Open,next LEVEL ${G.door.next}`
      : '[E] OPEN MAIN MENU';
  } else {
    pr.style.display='none';
  }
  if(P.atkT>0)P.atkT-=dt;
  if(P.atkAnim>0)P.atkAnim-=dt;
  if(P.hurtT>0)P.hurtT-=dt;
  if(P.dashCd>0)P.dashCd-=dt;
  for(const e of G.enemies) updEnemy(e,dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updBoss(dt);
  for(const p of G.projs){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<T||p.x>W-T||p.y<T||p.y>H-T){p.dead=true;continue;}
    if(p.from==='e'){
      if(Math.hypot(p.x-P.x,p.y-(P.y-18))<p.r+10){ hurtP(p.dmg); p.dead=true; }
    } else {
      for(const e of G.enemies)
        if(!e.dead&&Math.hypot(p.x-e.x,p.y-(e.y-14))<p.r+16){ hurtEnemy(e,p.dmg,false); p.dead=true; break; }
      if(!p.dead&&G.boss&&Math.hypot(p.x-G.boss.x,p.y-G.boss.y)<p.r+44){ hurtEnemy(G.boss,p.dmg,false); p.dead=true; }
    }
  }
  G.projs=G.projs.filter(p=>!p.dead);
  for(const d of G.drops){
    d.t+=dt;
    const dd=Math.hypot(P.x-d.x,P.y-14-d.y);
    if(dd<110){ d.x+=(P.x-d.x)*dt*6; d.y+=(P.y-14-d.y)*dt*6; }
    if(dd<20){
      d.dead=true;
      if(d.kind==='coin'){ S.coins+=d.v; AU.sfx('coin'); addFloat(P.x,P.y-56,'+'+d.v+'🪙','#ffd23f'); }
      else { gainXP(d.v); AU.sfx('gem'); }
    }
  }
  G.drops=G.drops.filter(d=>!d.dead);
  if(!isBossLvl(G.level)&&G.enemies.length===0&&!G.victory){
    if(G.wave<2){ nextWave(); toast(`Wave 2!`,1500); }
    else {
      completeLevel();
    }
  }
}
function drawLevel(t){
  const g=ctx;
  const th=themeOf(G.level);
  const sx=G.shake>0?rand(-G.shake,G.shake):0;
  const sy=G.shake>0?rand(-G.shake,G.shake):0;
  g.save(); g.translate(sx,sy);
  g.drawImage(G.levelBG,0,0);
  for (const o of G.obstacles) {
    g.fillStyle = 'rgba(0,0,0,0.3)';
    g.fillRect(o.x + 4, o.y + o.h - 2, o.w, 8);
    g.fillStyle = shadeColor(th.gC, -35);
    g.fillRect(o.x, o.y + 16, o.w, o.h - 16);
    g.fillStyle = th.far;
    g.fillRect(o.x, o.y, o.w, 20);
    g.fillStyle = shadeColor(th.far, 35);
    g.fillRect(o.x, o.y, o.w, 4);
    g.fillStyle = shadeColor(th.far, -30);
    g.fillRect(o.x, o.y + 16, o.w, 4);
  }
  if(G.door)drawLevelDoor(g,G.door,t);
  const ents=[];
  for(const e of G.enemies)ents.push({y:e.y,f:()=>drawEnemy(g,e,t)});
  if(G.boss)ents.push({y:G.boss.y,f:()=>drawBoss(g,G.boss,t)});
  ents.push({y:P.y,f:()=>drawPlayer(g,t)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  for(const p of G.projs){
    g.fillStyle=p.c;
    g.beginPath(); g.arc(p.x,p.y,p.r,0,Math.PI*2); g.fill();
    g.fillStyle='#fff'; g.fillRect(p.x-1,p.y-1,2,2);
  }
  for(const d of G.drops){
    const bb=Math.sin(d.t*6)*3;
    if(d.kind==='coin'){
      g.fillStyle='#8d6d1c'; g.beginPath(); g.arc(d.x,d.y+bb,7,0,Math.PI*2); g.fill();
      g.fillStyle='#ffd23f'; g.beginPath(); g.arc(d.x,d.y+bb-1,6,0,Math.PI*2); g.fill();
      g.fillStyle='#8d6d1c'; g.fillRect(d.x-1,d.y+bb-4,2,6);
    } else {
      g.fillStyle='#7ee0ff';
      g.save(); g.translate(d.x,d.y+bb); g.rotate(Math.PI/4);
      g.fillRect(-5,-5,10,10); g.restore();
    }
  }
  drawParts(g,G.cam);
  drawFloats(g,G.cam);
  g.restore();
  if(G.boss){
    const b=G.boss;
    g.fillStyle='#000a'; g.fillRect(W/2-220,14,440,26);
    g.strokeStyle='#e05555'; g.lineWidth=2; g.strokeRect(W/2-220,14,440,26);
    g.fillStyle='#7a1010'; g.fillRect(W/2-217,17,434,20);
    g.fillStyle='#ff5252'; g.fillRect(W/2-217,17,434*clamp(b.hp/b.maxhp,0,1),20);
    g.font='9px "Press Start 2P", monospace'; g.textAlign='center';
    g.fillStyle='#fff'; g.fillText(b.def.name,W/2,31);
    if(b.tele>0){
      g.fillStyle=`rgba(255,80,80,${0.3+0.3*Math.sin(t*20)})`;
      g.fillRect(W/2-220,44,440,8);
    }
  }
  g.font='9px "Press Start 2P", monospace'; g.textAlign='left';
  g.fillStyle='#000'; g.fillText(`LEVEL ${G.level} — ${th.name}${isBossLvl(G.level)?' ⚔BOSS':''}  ·  Enemies: ${G.enemies.length}`,13,H-11);
  g.fillStyle='#fff'; g.fillText(`LEVEL ${G.level} — ${th.name}${isBossLvl(G.level)?' ⚔BOSS':''}  ·  Enemies: ${G.enemies.length}`,12,H-12);
}
function drawLevelDoor(g,door,t){
  const glow=0.25+Math.sin(t*4)*0.1;
  g.save();
  g.globalAlpha=glow;
  g.fillStyle='#ffd27a';
  g.fillRect(door.x-34,door.y-56,68,62);
  g.globalAlpha=1;
  g.fillStyle='#24150b';
  g.fillRect(door.x-26,door.y-52,52,54);
  g.fillStyle='#8f5a28';
  g.fillRect(door.x-22,door.y-48,44,50);
  g.fillStyle='#f6d58f';
  g.fillRect(door.x-17,door.y-43,34,45);
  g.fillStyle='#5b3a1e';
  g.fillRect(door.x-12,door.y-38,24,40);
  g.fillStyle='#fff6e0';
  g.fillRect(door.x+7,door.y-18,5,5);
  g.fillStyle='#ffd27a';
  g.fillRect(door.x-32,door.y+4,64,5);
  g.fillStyle='#ffe08a';
  g.font='8px "Press Start 2P", monospace';
  g.textAlign='center';
  g.fillText(door.next?`LEVEL ${door.next}`:'MAIN MENU',door.x,door.y+25);

function drawEnemy(g,e,t){
  drawShadow(g,e.x,e.y+2,12);
  const bob=(e.t==='bat'||e.t==='ghost')?Math.sin(t*5+e.phase)*5:0;
  g.save();
  g.translate(Math.round(e.x),Math.round(e.y+bob));
  if(P.x<e.x)g.scale(-1,1);
  if(e.hurtT>0)g.globalAlpha=.5;
  g.drawImage(e.spr,-24,-48,48,48);
  g.restore();
  if(e.hp<e.maxhp){
    g.fillStyle='#000'; g.fillRect(e.x-16,e.y-44+(bob*0),32,5);
    g.fillStyle='#e05555'; g.fillRect(e.x-15,e.y-43,30*clamp(e.hp/e.maxhp,0,1),3);
  }
  nameTag(g,e.x,e.y-50,e.def.n,'#ffccbc');
}
function drawBoss(g,b,t){
  drawShadow(g,b.x,b.y+8,40);
  g.save();
  g.translate(Math.round(b.x),Math.round(b.y+Math.sin(t*2)*4));
  const flash = b.hurtT > 0 && Math.floor(t * 20) % 2 === 0;
  const tint = b.def.c2.length === 7 ? b.def.c2 : '#ffffff';
  const glow = g.createRadialGradient(0, -20, 10, 0, -20, 100);
  glow.addColorStop(0, tint + '99');
  glow.addColorStop(1, tint + '00');
  g.globalAlpha = 0.55 + 0.25 * Math.sin(t * 4);
  g.fillStyle = glow;
  g.beginPath(); g.arc(0, -20, 100, 0, Math.PI * 2); g.fill();
  g.globalAlpha = flash ? 0.5 : 1;
  g.drawImage(b.spr, -80, -110, 160, 160);
  g.restore();
}

const WORLD={cols:30,rows:14};
WORLD.w=WORLD.cols*T; WORLD.h=WORLD.rows*T;
let worldBG=null;
function buildWorldBG(){
  const c=document.createElement('canvas'); c.width=WORLD.w; c.height=WORLD.h;
  const g=c.getContext('2d');
  for(let ty=0;ty<WORLD.rows;ty++)for(let tx=0;tx<WORLD.cols;tx++)
    noiseTile(g,tx*T,ty*T,'#5cb85c','#54ae54','#48a048',tx,ty);
  g.fillStyle='#8d6e63';
  for(let tx=0;tx<WORLD.cols;tx++){ g.fillRect(tx*T,4,T,8); g.fillRect(tx*T,WORLD.h-12,T,8); }
  for(let ty=0;ty<WORLD.rows;ty++){ g.fillRect(4,ty*T,8,T); g.fillRect(WORLD.w-12,ty*T,8,T); }
  return c;
}
function mouseTile(){
  return { tx: Math.floor((mouse.x+G.cam.x)/T), ty: Math.floor((mouse.y+G.cam.y)/T) };
}

function frontTile(){
  const wx = P.x + G.cam.x + Math.cos(P.face) * T * 0.9;
  const wy = P.y + G.cam.y - 8 + Math.sin(P.face) * T * 0.9;
  return { tx: Math.floor(wx/T), ty: Math.floor(wy/T) };
}

function insideWorld(tx,ty){
  return tx>=1 && ty>=1 && tx<WORLD.cols-1 && ty<WORLD.rows-1;
}

function placeDecor(tx,ty){
  if(G.modal || !insideWorld(tx,ty))return;
  const sel=G.worldSel;
  if(!sel){ toast('Chose any decoration'); return; }
  if(placedCount(sel)>=ownedCount(sel)){ toast('You dont have this decoration.'); return; }
  if(S.world.some(w=>w.tx===tx&&w.ty===ty)){ toast('There are already decoration on this place'); return; }
  S.world.push({id:sel.id,tx,ty});
  save(); AU.sfx('place');
  burst(tx*T+24,ty*T+24,'#fff',8,80,3);
  buildWorldBar();
}

function removeDecor(tx,ty){
  if(G.modal || !insideWorld(tx,ty))return;
  const i=S.world.findIndex(w=>w.tx===tx&&w.ty===ty);
  if(i<0){ if(touchEnabled())toast('Nothing to remove here'); return; }
  S.world.splice(i,1);
  save(); AU.sfx('hit');
  buildWorldBar();
}

function worldClick(){
  if(G.modal)return;
  const {tx,ty}=mouseTile();
  if(G.worldMode==='place')placeDecor(tx,ty);
  else removeDecor(tx,ty);
}

function ownedCount(sel){
  const n=+sel.id.slice(1);
  if(sel.kind==='decor')return S.decor[n]||0;
  return S.trophy[n]||0;
}
function placedCount(sel){
  return S.world.filter(w=>w.id===sel.id).length;
}
function selIdOf(w){
  return w.id;
}
function decorDefOf(id){
  if(id.startsWith('D'))return DECOR[+id.slice(1)];
  return TROPHIES[+id.slice(1)];
}
function updWorld(dt){
  movePlayer(dt,(x,y)=>{
    const cx=x+G.cam.x, cy=y+G.cam.y;
    return cx<T||cy<T||cx>WORLD.w-T||cy>WORLD.h-T;
  },{x0:0,y0:0,x1:9999,y1:9999});
  G.cam.x=clamp(P.x-W/2,0,WORLD.w-W);
  G.cam.y=clamp(P.y-H/2,0,Math.max(0,WORLD.h-H));
}
function drawWorld(t){
  const g=ctx;
  if(!worldBG)worldBG=buildWorldBG();
  g.drawImage(worldBG,-G.cam.x,-G.cam.y);
  g.strokeStyle='rgba(255,255,255,.12)'; g.lineWidth=1;
  for(let tx=0;tx<=WORLD.cols;tx++){ g.beginPath(); g.moveTo(tx*T-G.cam.x,-G.cam.y); g.lineTo(tx*T-G.cam.x,WORLD.h-G.cam.y); g.stroke(); }
  for(let ty=0;ty<=WORLD.rows;ty++){ g.beginPath(); g.moveTo(-G.cam.x,ty*T-G.cam.y); g.lineTo(WORLD.w-G.cam.x,ty*T-G.cam.y); g.stroke(); }
  const ds=[...S.world].sort((a,b)=>(a.ty-b.ty));
  for(const w of ds){
    drawDecor(g,decorDefOf(w.id),w.tx*T-G.cam.x,w.ty*T-G.cam.y,t);
  }
  if(G.worldSel&&G.worldMode==='place'){
    const aim=touchEnabled()?frontTile():mouseTile();
    const tx=aim.tx, ty=aim.ty;
    if(tx>0&&ty>0&&tx<WORLD.cols-1&&ty<WORLD.rows-1){
      g.globalAlpha=.55;
      drawDecor(g,decorDefOf(G.worldSel.id),tx*T-G.cam.x,ty*T-G.cam.y,t);
      g.globalAlpha=1;
      g.strokeStyle='#ffd23f'; g.strokeRect(tx*T-G.cam.x,ty*T-G.cam.y,T,T);
    }
  }
  drawPlayer(g,t);
  drawParts(g,G.cam);
  nameTag(g,W/2-G.cam.x+G.cam.x,20,'Mode : '+(G.worldMode==='place'?'Place':'Remove'),'#80deea');
}
function buildWorldBar(){
  const items=[];
  DECOR.forEach((d,i)=>{ if((S.decor[i]||0)>0)items.push({kind:'decor',id:'D'+i,def:d}); });
  TROPHIES.forEach((d,i)=>{ if((S.trophy[i]||0)>0)items.push({kind:'trophy',id:'T'+i,def:d}); });
  let html=`<div style="display:flex;gap:8px;align-items:center">
    <button class="pbtn ${G.worldMode==='place'?'gold':''}" onclick="worldMode('place')">PLace</button>
    <button class="pbtn ${G.worldMode==='remove'?'red':''}" onclick="worldMode('remove')">Remove</button>
    <div id="witems">`;
  if(items.length===0) html+=`<span class="ui-muted" style="font-size:8px;padding:8px">you dont have any decoration, go buy to unc restu</span>`;
  for(const it of items){
    const left=ownedCount(it)-placedCount(it);
    const sel=G.worldSel&&G.worldSel.id===it.id;
    html+=`<div class="wslot ${sel?'sel':''}" onclick="worldSel('${it.id}')">${it.def.name}<br><span class="cnt">x${left}</span></div>`;
  }
  html+=`</div>
    <button class="pbtn red" onclick="leaveWorld()">Go Back To Ilands</button>
  </div>`;
  $('worldbar').innerHTML=html;
}
function worldMode(m){ G.worldMode=m; buildWorldBar(); }
function worldSel(id){

function spawnFarmMob(){
  const th=THEMES[randi(0,THEMES.length-1)];
  const mdef=th.mobs[randi(0,th.mobs.length-1)];
  const tier=mdef.tier;
  const sisi=randi(0,2);
  let x,y;
  if(sisi===0){ x=T+40; y=rand(T*2,H-T*2); }
  else if(sisi===1){ x=W-T-40; y=rand(T*2,H-T*2); }
  else { x=rand(T*2,W-T*2); y=H-T-30; }
  const hp=Math.round((FARM.hpBase+S.plvl*FARM.hpPerLevel)*tier);
  G.enemies.push({
    x,y, def:mdef, farm:true,
    hp, maxhp:hp,
    dmg:(FARM.dmgBase+S.plvl*FARM.dmgPerLevel)*tier,
    spd:rand(40,55)+(mdef.t==='bat'?30:0)-(mdef.t==='golem'?15:0),
    spr:mobSprite(mdef.t,mdef.c,mdef.c2,mdef.e),
    t:mdef.t, tier,
    hop:rand(0,1), shootT:rand(3,5), dashT:0, dashCd:rand(3,5),
    slow:0, burn:0, hurtT:0, phase:rand(0,6),
  });
}

function dropFarmXp(e){
  const total=FARM.xpBase+S.plvl*FARM.xpPerLevel;
  const n=randi(1,2);
  for(let i=0;i<n;i++)
    G.drops.push({kind:'gem',x:e.x+rand(-16,16),y:e.y+rand(-16,16),v:Math.max(1,Math.round(total/n)),t:0});
  G.farmKills++;
}

function updFarm(dt){
  if(Math.random()<dt*4)ambientPart(FARM_THEME);
  movePlayer(dt,lvlSolid,{x0:T+10,x1:W-T-10,y0:T+22,y1:H-T-6});
  const pr=$('prompt');
  if(dist(P,FARM_EXIT)<82){ pr.style.display='block'; pr.textContent='[E] Back to Islands'; }
  else pr.style.display='none';
  if(P.atkT>0)P.atkT-=dt;
  if(P.atkAnim>0)P.atkAnim-=dt;
  if(P.hurtT>0)P.hurtT-=dt;
  if(P.dashCd>0)P.dashCd-=dt;
  G.farmSpawnT-=dt;
  if(G.farmSpawnT<=0 && G.enemies.length<FARM.maxMobs){
    spawnFarmMob();
    G.farmSpawnT=FARM.spawnDelay;
  }
  for(const e of G.enemies) updEnemy(e,dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  for(const p of G.projs){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<T||p.x>W-T||p.y<T||p.y>H-T){p.dead=true;continue;}
    if(p.from==='e'){
      if(Math.hypot(p.x-P.x,p.y-(P.y-18))<p.r+10){ hurtP(p.dmg); p.dead=true; }
    } else {
      for(const e of G.enemies)
        if(!e.dead&&Math.hypot(p.x-e.x,p.y-(e.y-14))<p.r+16){ hurtEnemy(e,p.dmg,false); p.dead=true; break; }
    }
  }
  G.projs=G.projs.filter(p=>!p.dead);
  for(const d of G.drops){
    d.t+=dt;
    const jarak=Math.hypot(P.x-d.x,P.y-14-d.y);
    if(jarak<110){ d.x+=(P.x-d.x)*dt*6; d.y+=(P.y-14-d.y)*dt*6; }
    if(jarak<20){
      d.dead=true;
      gainXP(d.v);
      AU.sfx('gem');
      addFloat(P.x,P.y-56,'+'+d.v+' XP','#7ee0ff');
    }
  }
  G.drops=G.drops.filter(d=>!d.dead);
}

function openArmor(){
  AU.init();
  let html=`<div class="mhead"><h2>Dhanis Baja Shop</h2>
    <button class="pbtn red" onclick="closeModal()">✖</button></div>
    <div class="mbody">
    <div class="ui-accent" style="margin-bottom:8px">🪙 Y Coin: ${S.coins}</div>
    <div class="grid">`;
  ARMORS.forEach((a,i)=>{
    const owned=S.armors.includes(i);
    const equipped=S.eqA===i;
    html+=`<div class="card">
      <div class="nm rarity-${a.rarity}">${a.name}</div>
      <div class="st">DEF ${a.def} · +${a.hp} HP</div>
      <div class="ds">${RARITY_NAME[a.rarity]}</div>
      ${owned
        ? `<button class="mini ${equipped?'dis':''}" ${equipped?'':`onclick="equipArmor(${i})"`}>${equipped?'Equipped':'Equip'}</button>`
        : `<div class="pv">🪙 ${a.price}</div>
           <button class="mini ${S.coins<a.price?'dis':''}" ${S.coins<a.price?'':`onclick="buyArmor(${i})"`}>Buy</button>`}
    </div>`;
  });
  html+='</div></div>';
  openModal(html);
}
function buyArmor(i){
  const a=ARMORS[i];
  if(S.coins<a.price)return;
  S.coins-=a.price; S.armors.push(i); save(); AU.sfx('buy');
  P.hp=Math.min(P.hp+ a.hp, pMaxHp());
  toast(`✅ ${a.name} dibeli!`); openArmor();
}
function equipArmor(i){ S.eqA=i; save(); AU.sfx('buy'); openArmor(); }
window.buyArmor=buyArmor; window.equipArmor=equipArmor; window.openArmor=openArmor;

function openSettings(){
  AU.init();
  const html=`<div class="mhead"><h2>⚙ Setting</h2>
    <button class="pbtn red" onclick="closeModal()">✖</button></div>
    <div class="mbody">
      <div class="srow"><span>VOLUME</span>
        <input type="range" min="0" max="100" value="${Math.round(S.set.vol*100)}"
          oninput="setVol(this.value)"><b id="volv">${Math.round(S.set.vol*100)}%</b></div>
      <div class="srow"><span>Saturation</span>
        <input type="range" min="40" max="130" value="${Math.round(S.set.bri*100)}"
          oninput="setBri(this.value)"><b id="briv">${Math.round(S.set.bri*100)}%</b></div>

function setVol(v){ S.set.vol=v/100; AU.setVol(S.set.vol); $('volv').textContent=v+'%'; save(); }
function setBri(v){ S.set.bri=v/100; applySettings(); $('briv').textContent=v+'%'; save(); }
function applySettings(){
  cv.style.filter=`brightness(${S.set.bri})`;
  AU.vol=S.set.vol; if(AU.gain)AU.gain.gain.value=S.set.vol;
}
function resetSave(){
  if(confirm('Hapus SEMUA progres?')){
    localStorage.removeItem(SAVE_KEY); location.reload();
  }
}
window.setVol=setVol; window.setBri=setBri; window.resetSave=resetSave;
window.openSettings=openSettings;

function openLevels(){
  AU.init();
  let html=`<div class="mhead"><h2>Level Unlocked: ${Math.min(S.progress,100)}</h2>
    <button class="pbtn red" onclick="closeModal()">✖</button></div>
    <div class="mbody"><div class="lvlgrid">`;
  for(let i=1;i<=100;i++){
    const lock=i>S.progress;
    const boss=isBossLvl(i);
    const done=i<S.progress;
    const th=themeOf(i);
    html+=`<div class="lvlcell ${lock?'lock':''} ${boss?'boss':''} ${done?'done':''}"
      title="${th.name}${boss?' — BOSS':''}"
      ${lock?'':`onclick="pickLevel(${i})"`}>${boss?'BL':''}${i}</div>`;
  }
  html+='</div><p class="ui-muted" style="margin-top:10px;font-size:7px;line-height:1.8">  ';
  openModal(html);
}
function pickLevel(n){
  closeModal();
  fadeTo(()=>startLevel(n),900);
}
window.pickLevel=pickLevel; window.openLevels=openLevels;

function updateHUD(){
  $('plvl').textContent='Lv '+S.plvl;
  $('coinbox').textContent='🪙 '+S.coins;
  const sd=swordDef();
  $('wpn').innerHTML=`⚔ <span class="rarity-${sd.rarity}">${sd.name}</span><br>DMG ${pDmg()} · DEF ${pDef()}`;
}
function updateBars(){
  $('hpf').style.transform=`scaleX(${clamp(P.hp/pMaxHp(),0,1)})`;
  $('hpt').textContent=`${Math.ceil(P.hp)}/${pMaxHp()}`;
  $('xpf').style.transform=`scaleX(${clamp(S.xp/xpNeed(),0,1)})`;
  $('xpt').textContent=`${S.xp}/${xpNeed()}`;
}

const vignette = (() => {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.62);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.38)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  return c;
})();

const lightLayer = (() => {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#ffe9a8');
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, '#8fa4ff');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  return c;
})();

function drawAtmosphere() {
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(lightLayer, 0, 0);
  ctx.restore();
  ctx.drawImage(vignette, 0, 0);
}

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!G.started)return;
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  G.time+=dt;
  const t=G.time;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  updParts(dt);
  ctx.clearRect(0,0,W,H);
  if(G.scene==='hub'){ updHub(dt); drawHub(t); }
  else if(G.scene==='level'){ if(!G.modal)updLevel(dt); drawLevel(t); }
  else if(G.scene==='farm'){ if(!G.modal)updFarm(dt); drawFarm(t); }
  else if(G.scene==='world'){ updWorld(dt); drawWorld(t); }
  updateTouchUI();
  if(G.scene!=='world')drawAtmosphere();
  updateBars();
  G.hudT=(G.hudT||0)+dt;
  if(G.hudT>0.25){ G.hudT=0; updateHUD(); }
}

const isTouchDevice = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const stick = { active:false, x:0, y:0 };
const padHeld = { attack:false };

const ICONS = {
  attack: ["......##", ".....###", "....###.", "...###..", "#.###...", ".###....", ".##.....", "#..#...."],
  jump:   ["...##...", "..####..", ".######.", "########", "...##...", "...##...", "...##...", "...##..."],
  dash:   ["....###.", "...###..", "..###...", ".######.", "...###..", "..###...", ".###....", ".#......"],
  use:    ["...##...", "...##...", "...##.#.", ".#.#####", ".#######", "########", ".#######", "..#####."],
  place:  ["...##...", "...##...", "...##...", "########", "########", "...##...", "...##...", "...##..."],
  remove: ["##....##", "###..###", ".######.", "..####..", "..####..", ".######.", "###..###", "##....##"],
};

function touchEnabled(){
  return S.set.touch === undefined ? isTouchDevice : S.set.touch;
}

function toggleTouch(){
  S.set.touch = !touchEnabled();
  save();
  const btn = $('touchToggle');
  btn.textContent = S.set.touch ? 'ON' : 'OFF';
  btn.className = 'pbtn ' + (S.set.touch ? 'gold' : 'red');
}
window.toggleTouch = toggleTouch;

function pixelIcon(rows){
  let rects = '';
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      if (row[x] === '#') rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
  });
  return `<svg viewBox="0 0 8 8">${rects}</svg>`;
}

function bindButton(id, icon, label, onPress, onRelease){
  const el = $(id);
  el.innerHTML = pixelIcon(ICONS[icon]) + (label ? `<span>${label}</span>` : '');
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    AU.init();
    el.classList.add('down');
    el.setPointerCapture(e.pointerId);
    onPress();
  });
  const letGo = () => {
    el.classList.remove('down');
    if (onRelease) onRelease();
  };
  el.addEventListener('pointerup', letGo);
  el.addEventListener('pointercancel', letGo);
}

function aimAtNearestEnemy(){
  let nearest = null, nearestDist = 170;
  const targets = G.boss ? [...G.enemies, G.boss] : G.enemies;
  for (const e of targets) {
    const d = dist(P, e);
    if (d < nearestDist) { nearest = e; nearestDist = d; }
  }
  if (!nearest) return;
  P.face = Math.atan2(nearest.y - P.y, nearest.x - P.x);
  P.dir = Math.cos(P.face) >= 0 ? 1 : -1;
}

function canInteractNow(){
  if (G.scene === 'hub') return !!nearInteract();
  if (G.scene === 'level') return !!G.door && dist(P, G.door) < 82;
  if (G.scene === 'farm') return dist(P, FARM_EXIT) < 82;
  return false;
}

function moveStick(e){
  const base = $('stickBase').getBoundingClientRect();
  const reach = base.width / 2 - 8;
  let dx = e.clientX - (base.left + base.width / 2);
  let dy = e.clientY - (base.top + base.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > reach) { dx = dx / len * reach; dy = dy / len * reach; }
  $('stickKnob').style.transform = `translate(${dx}px, ${dy}px)`;
  stick.x = dx / reach;
  stick.y = dy / reach;
  if (Math.hypot(stick.x, stick.y) < 0.2) { stick.x = 0; stick.y = 0; }
}

function releaseStick(){
  stick.active = false;
  stick.x = 0;
  stick.y = 0;
  $('stickKnob').style.transform = '';
}

const stickBase = $('stickBase');
stickBase.addEventListener('pointerdown', e => {
  e.preventDefault();
  AU.init();
  stick.active = true;
  stickBase.setPointerCapture(e.pointerId);
  moveStick(e);
});
stickBase.addEventListener('pointermove', e => { if (stick.active) moveStick(e); });
stickBase.addEventListener('pointerup', releaseStick);
stickBase.addEventListener('pointercancel', releaseStick);
$('touchUI').addEventListener('contextmenu', e => e.preventDefault());

bindButton('tAttack', 'attack', '', () => { padHeld.attack = true; }, () => { padHeld.attack = false; });
bindButton('tJump', 'jump', '', tryJump);
bindButton('tDash', 'dash', '', () => { if (inBattle()) tryDash(); });
bindButton('tUse', 'use', '', () => { if (!G.modal) interact(); });
bindButton('tPlace', 'place', 'PLACE', () => { const f = frontTile(); placeDecor(f.tx, f.ty); });
bindButton('tRemove', 'remove', 'REMOVE', () => { const f = frontTile(); removeDecor(f.tx, f.ty); });

function showTouchButton(id, visible){
  const el = $(id);
  const wanted = visible ? 'flex' : 'none';
  if (el.style.display !== wanted) el.style.display = wanted;
}

function updateTouchUI(){
  const ui = $('touchUI');
  const visible = touchEnabled() && G.started && !G.modal;
  ui.classList.toggle('on', visible);
  if (!visible) {
    if (stick.active) releaseStick();
    padHeld.attack = false;
    return;
  }
  const inWorld = G.scene === 'world';
  const holding = inWorld && !!G.worldSel;
  ui.classList.toggle('inworld', inWorld);
  showTouchButton('tAttack', inBattle());
  showTouchButton('tDash', inBattle());
  showTouchButton('tUse', canInteractNow());
  showTouchButton('tPlace', holding);
  showTouchButton('tRemove', holding);
  if (padHeld.attack && inBattle()) {
    aimAtNearestEnemy();
    tryAttack();
  }
  const prompt = $('prompt');
  if (prompt.style.display === 'block') prompt.textContent = prompt.textContent.replace('[E] ', '');
}

function startGame(){
  $('title').style.display='none';
  $('hud').style.display='flex';
  $('topbtns').style.display='flex';
  G.started=true;
  AU.init();
  G.hubBG=buildHubBG();
  applySettings();
  gotoHub();
  toast('Welcome to this game world<br>if you want to defeat this world, then start by coming to Unc Restu',4000);
}
addEventListener('keydown',function onEnter(e){
  if(e.key==='Enter'&&!G.started){ startGame(); }
});
$('title').addEventListener('click',()=>{ if(!G.started)startGame(); });
$('btnWorld').onclick=()=>{ if(G.scene==='hub')gotoWorld(); else if(G.scene==='world')leaveWorld(); else if(G.scene==='farm')toast('Back to ilands first'); else toast('beat this level first'); };
$('btnLevels').onclick=()=>{ if(G.scene==='hub')openLevels(); else toast('Back to ilands first'); };
$('btnInv').onclick=()=>openInv();
$('btnSettings').onclick=()=>openSettings();
requestAnimationFrame(loop);

</script>
